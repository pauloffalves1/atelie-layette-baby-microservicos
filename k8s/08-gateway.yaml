apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: atelie-bebe-dev
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        newrelic.com/inject-dotnet: "true"
    spec:
      containers:
        - name: gateway
          # Not ":latest" — Docker Desktop's Kubernetes has its own containerd image store,
          # separate from the plain `docker build` one, and only imports a given tag once. With
          # `imagePullPolicy: IfNotPresent` a rebuilt ":latest" is silently ignored (K8s already
          # "has" that tag); `Always` isn't an option either since it would try to reach a real
          # registry for an image that only exists locally. After every `docker compose build
          # gateway`, retag and bump this: `docker tag microservices-gateway:latest
          # microservices-gateway:v2` (v3, v4, ...), then `kubectl set image
          # deployment/gateway gateway=microservices-gateway:v2 -n atelie-bebe-dev`.
          image: microservices-gateway:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
---
# The only Service reachable from outside the cluster (besides the frontend shell, added once the
# microfrontend split lands) — every other service above is ClusterIP-only, matching the plan's
# "Gateway is the single public entry point" design.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: atelie-bebe-dev
spec:
  type: NodePort
  selector: { app: gateway }
  ports:
    - port: 8080
      nodePort: 30500 # http://localhost:30500 on Docker Desktop's Kubernetes
