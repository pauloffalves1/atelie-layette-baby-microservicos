# The RSA key pair (identity signs, everyone else validates) is NEVER stored in a committed YAML —
# create it imperatively from the same files docker-compose bind-mounts from ../keys/:
#
#   kubectl create secret generic jwt-keys -n atelie-bebe-dev \
#     --from-file=jwt-private.pem=../keys/jwt-private.pem \
#     --from-file=jwt-public.pem=../keys/jwt-public.pem
#
# Everything below is safe to commit — either genuinely empty (WhatsApp/Resend/PagBank aren't
# configured yet, same "blocked pending credentials" state as the monolith) or the same
# well-known local-dev default (AdminSeed) already committed in every service's appsettings.json.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: atelie-bebe-dev
type: Opaque
stringData:
  AdminSeed__Password: "admin123"
  WhatsApp__AccessToken: ""
  Resend__ApiKey: ""
  PagBank__Token: ""
  # New Relic APM auto-injection (k8s-agents-operator) reads this via a NewRelic-config Secret it
  # expects by convention — see the "New Relic" section of the plano de arquitetura for the exact
  # `helm install`/license-key wiring once the user has a (free-tier) New Relic account.
  NEW_RELIC_LICENSE_KEY: ""
