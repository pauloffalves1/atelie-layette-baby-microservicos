apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  namespace: atelie-bebe-dev
spec:
  replicas: 1
  selector:
    matchLabels: { app: notifications }
  template:
    metadata:
      labels: { app: notifications }
      annotations:
        newrelic.com/inject-dotnet: "true"
    spec:
      containers:
        - name: notifications
          image: microservices-notifications:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef: { name: app-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
  namespace: atelie-bebe-dev
spec:
  selector: { app: notifications }
  ports:
    - port: 8080
