# /etc/nginx/conf.d/bot-detect.conf — http-context maps used by the site config (see README.md).

# Link-unfurling bots (WhatsApp, Facebook, Telegram, etc.) fetch a shared URL's raw HTML and never
# run JavaScript — routed to the backend's server-rendered OG/Twitter Card preview (/api/seo/*).
map $http_user_agent $is_bot {
    default 0;
    "~*(facebookexternalhit|Facebot|WhatsApp|Twitterbot|TelegramBot|LinkedInBot|Slackbot|Discordbot|redditbot|Pinterest|vkShare|SkypeUriPreview|Applebot|W3C_Validator)" 1;
}

# Search-engine crawlers — served the prerendered snapshots from frontend/shell/scripts/prerender.mjs
# (same content people see, already rendered) instead of the empty client-rendered shell.
map $http_user_agent $is_search_bot {
    default 0;
    "~*(Googlebot|Google-InspectionTool|Storebot-Google|GoogleOther|AdsBot-Google|bingbot|BingPreview|msnbot|DuckDuckBot|YandexBot|Baiduspider|PetalBot|SeznamBot|Qwantify|Ecosia)" 1;
}

# Only page routes (no file extension) — a crawler asking for /images/x.jpg or a .css must still get the file.
map "$is_search_bot:$uri" $prerender_page {
    default 0;
    "~^1:[^.]*$" 1;
}

# Category landing pages (/loja?categoria=...) have their own snapshot under q/<query>/. Only this
# exact, character-restricted shape maps to a path (no "/" can come from the query string).
map $args $prerender_query {
    default "";
    "~^(categoria=[A-Za-z0-9%._~-]+)$" "/q/$1";
}
