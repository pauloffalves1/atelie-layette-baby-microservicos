<section class="py-5">
  <div class="container">
    <div class="text-center mb-5">
      <h1 class="section-title text-center fs-1">Dicas para o casal</h1>
      <p class="text-secondary mt-3">Um pouquinho dos trabalhos feitos com carinho para as famílias que confiam no Ateliê Layette Baby.</p>
    </div>

    <div class="row g-3">
      @for (image of images(); track image; let i = $index) {
        <div class="col-6 col-md-4 col-lg-3">
          <button type="button" class="d-block w-100 p-0 bg-transparent rounded-4 overflow-hidden shadow-sm gallery-thumb" style="aspect-ratio: 4/5;"
            [attr.aria-label]="'Ampliar foto ' + (i + 1) + ' de ' + images().length" (click)="open(i)">
            <img [src]="image" alt="" class="w-100 h-100 object-fit-cover" loading="lazy">
          </button>
        </div>
      }
    </div>
  </div>
</section>

@if (selectedIndex() !== null) {
  <app-image-lightbox [images]="images()" [index]="selectedIndex()!" (indexChange)="selectedIndex.set($event)"
    alt="Trabalho do ateliê" (closed)="close()" />
}
