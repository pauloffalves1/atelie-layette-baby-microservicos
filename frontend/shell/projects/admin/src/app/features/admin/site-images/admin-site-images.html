<div class="p-4 p-lg-5">
  <h2 class="mb-1">Imagens do site</h2>
  <p class="text-secondary mb-4">Troque as fotos principais do site sem precisar mexer no código.</p>

  <div class="row g-4">
    @for (row of rows(); track row.key) {
      <div class="col-md-6 col-lg-4">
        <div class="stat-card h-100">
          <h6 class="mb-3">{{ row.label }}</h6>
          <div class="ratio ratio-1x1 rounded-4 overflow-hidden mb-3" style="max-width: 260px;">
            <img [src]="row.url" [alt]="row.label" class="w-100 h-100 object-fit-cover">
          </div>

          <label class="btn btn-outline-secondary rounded-pill btn-sm" [class.disabled]="row.uploading">
            @if (row.uploading) {
              <span class="spinner-border spinner-border-sm me-2"></span>Enviando...
            } @else {
              <i class="bi bi-upload me-1"></i>Trocar imagem
            }
            <input type="file" accept="image/jpeg,image/png,image/webp" class="d-none"
              [disabled]="row.uploading" (change)="onFileSelected(row.key, $event)">
          </label>

          @if (row.saved) {
            <div class="small text-success mt-2"><i class="bi bi-check-circle-fill me-1"></i>Imagem atualizada!</div>
          }
          @if (row.error) {
            <div class="small text-danger mt-2">{{ row.error }}</div>
          }
        </div>
      </div>
    }
  </div>
</div>
